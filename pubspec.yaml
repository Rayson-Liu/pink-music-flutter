name: pink_music_android_main
description: "Pink Music - An Open Source Bilibili Music Player"
publish_to: 'none'

version: 1.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.0
  flutter_media_session: ^3.0.1
  audio_session: ^0.2.0
  dio: ^5.7.0
  crypto: ^3.0.6
  shared_preferences: ^2.3.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  file_picker: ^11.0.3
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  flujs: ^0.1.0+1
  flujs_qjs: ^0.1.0
  flujs_jsc: ^0.1.0
  url_launcher: ^6.3.0
  pointycastle: ^4.0.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/pink.png"
  adaptive_icon_background: "#FF69B4"
  adaptive_icon_foreground: "assets/pink.png"
  min_sdk_android: 24

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
